
<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <h1>USER DETAILS</h1>

    <script>
        async function getUsers()
        {
            try {
                const data = await fetch("https://jsonplaceholder.typicode.com/users");

                const users = await data.json();

                console.log(users);

            } catch(err) {
                console.log(err);
            }
        }

        getUsers();
    </script>
